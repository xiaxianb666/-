name: Daily Stock Monitor

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  stock_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: 安装依赖库
        run: pip install yfinance pandas requests
        
      - name: 运行股票监控脚本
        run: python stock.py
